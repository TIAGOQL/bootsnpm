name: CI

on: [push, pull_request]

env:
  FORCE_COLOR: 2

jobs:
  test:
    name: Static page check
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Verify poem page files
        run: |
          test -f index.html
          test -f assets/css/starter.css
          grep -q "Minhas lágrimas são suas" index.html
          grep -q "poem-page" assets/css/starter.css
