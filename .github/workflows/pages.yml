name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/poemas _site/pesquisas _site/cultivo/ideias
          cp index.html _site/
          cp assets/css/starter.css _site/assets/css/
          cp assets/js/*.js _site/assets/js/
          cp poemas/*.html _site/poemas/
          cp pesquisas/*.html _site/pesquisas/
          cp pesquisas/*.md _site/pesquisas/
          cp cultivo/README.md _site/cultivo/
          cp cultivo/ideias/*.md _site/cultivo/ideias/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
