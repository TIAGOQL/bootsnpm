name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/assets/img _site/poemas _site/pesquisas _site/cultivo/ideias
          cp index.html _site/
          cp assets/css/starter.css _site/assets/css/
          cp assets/js/*.js _site/assets/js/
          cp assets/img/* _site/assets/img/
          cp poemas/*.html _site/poemas/
          cp pesquisas/*.html _site/pesquisas/
          cp pesquisas/*.md _site/pesquisas/
          cp cultivo/README.md _site/cultivo/
          cp cultivo/ideias/*.md _site/cultivo/ideias/
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
