<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Playlist da rádio REM — 12 mixes do Vinylzera. Clique toca na rádio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/starter.css">
    <title>Vinylzera — vídeos</title>
  </head>
  <body class="poem-page research-page">
    <div class="rain" aria-hidden="true"></div>
    <a class="panel-shortcut" href="../index.html">← Painel</a>

    <main class="poem-shell research-shell panel-shell-wide">
      <header class="poem-brand">
        <p class="poem-for">playlist da rádio</p>
        <h1 class="poem-title">Vinylzera — vídeos</h1>
        <p class="panel-lede">Os 12 mixes. Clique manda pra rádio.</p>
      </header>

      <article class="poem research-body" aria-label="Catálogo Vinylzera">
        <p><strong>Playlist da <a href="radio.html">rádio</a>:</strong> <a href="vinylzera.html">Vinylzera</a> no comando · <code>@VinylzeraMusic</code> · retrato 20 ago 2026 · 12 mixes. Clique toca na rádio. <a href="vinylzera.html">Ficha do DJ</a>.</p>
      </article>

      <div class="catalog" data-catalog>
        <form class="catalog-form cultivo-form" data-catalog-form>
          <p class="catalog-count" data-catalog-count>carregando…</p>
          <label>
            <span>Busca</span>
            <input name="query" type="search" maxlength="120" placeholder="título, artista ou id" autocomplete="off">
          </label>
          <div class="catalog-filters">
            <label>
              <span>Tipo</span>
              <select name="kind">
                <option value="all">todos</option>
                <option value="video">vídeo</option>
              </select>
            </label>
            <label>
              <span>Década</span>
              <select name="decade">
                <option value="all">todas</option>
                <option value="80s">80s</option>
                <option value="mix">70s + 80s</option>
                <option value="70s">70s</option>
              </select>
            </label>
            <label>
              <span>Ordem</span>
              <select name="sort">
                <option value="channel">canal (recente)</option>
                <option value="views">mais vistos</option>
                <option value="duration">mais longos</option>
                <option value="az">A–Z</option>
              </select>
            </label>
          </div>
        </form>
        <nav class="catalog-grid" data-catalog-list aria-label="Mixes do Vinylzera"></nav>
        <nav class="catalog-pager" data-catalog-pager hidden>
          <button type="button" class="catalog-pager-btn" data-catalog-prev>Anterior</button>
          <p class="catalog-pager-status" data-catalog-page></p>
          <button type="button" class="catalog-pager-btn" data-catalog-next>Próxima</button>
        </nav>
      </div>

      <p class="research-note">
        <a href="vinylzera-videos.md">texto</a> ·
        <a href="radio.html">Rádio</a> ·
        <a href="vinylzera.html">Vinylzera</a> ·
        <a href="../assets/data/vinylzera-videos.json">JSON</a> ·
        <a href="https://www.youtube.com/@VinylzeraMusic/videos" rel="noopener noreferrer" target="_blank">YouTube</a> ·
        <a href="cultivo-ideias.html">Cultivo</a>
      </p>
    </main>

    <script type="module" src="../assets/js/vinylzera-videos.js"></script>
  </body>
</html>
