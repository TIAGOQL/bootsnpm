<body data-page="jogos-broto">
    <div id="site-header"></div>

    <main id="main-content" class="conteudo videos-page jogos-page">
        <header class="videos-header">
            <p class="guia-badge" data-i18n="pages.games.eyebrow">Games</p>
            <h1 data-i18n="pages.games.brotoTitle">Broto</h1>
            <p class="secao-subtitulo" data-i18n="pages.games.brotoDesc">Bichinho-planta virtual no jeito do Pou. Dê água, sol, carinho e limpe o vaso. Ele cresce e fica salvo neste aparelho — é só brincadeira, não é diário de cultivo.</p>
            <p class="secao-subtitulo"><a href="/jogos/" data-i18n="pages.games.title">← Games</a></p>
        </header>

        <section id="jogos-broto" class="jogos-broto" aria-labelledby="jogos-broto-title">
            <div id="broto-app" class="broto-app" data-mood="happy" data-stage="sprout">
                <div class="broto-toolbar">
                    <label class="broto-name-wrap">
                        <span class="visually-hidden" data-i18n="pages.games.brotoNameLabel">Nome do Broto</span>
                        <input type="text" id="broto-name" class="broto-name" maxlength="18" autocomplete="off" spellcheck="false" value="Broto">
                    </label>
                    <p id="broto-stage-label" class="broto-stage-label">Brotinho</p>
                    <p id="broto-age" class="broto-age"></p>
                </div>

                <div class="broto-room" id="broto-room">
                    <div class="broto-window" aria-hidden="true"></div>
                    <p id="broto-speech" class="broto-speech" hidden></p>
                    <button type="button" id="broto-pet" class="broto-pet" aria-label="Fazer carinho no Broto">
                        <span class="broto-sprite" aria-hidden="true">
                            <svg class="broto-svg" viewBox="0 0 200 250" role="img">
                                <title>Broto</title>
                                <g class="broto-plant">
                                    <path class="broto-leaf broto-leaf--l" d="M88 78c-22-28-48-22-52-6 18 4 32 22 52 28z"/>
                                    <path class="broto-leaf broto-leaf--r" d="M112 78c22-28 48-22 52-6-18 4-32 22-52 28z"/>
                                    <path class="broto-stem" d="M100 72v36"/>
                                </g>
                                <ellipse class="broto-shadow" cx="100" cy="208" rx="42" ry="8"/>
                                <g class="broto-body-wrap">
                                    <ellipse class="broto-body" cx="100" cy="142" rx="54" ry="50"/>
                                    <ellipse class="broto-belly" cx="100" cy="156" rx="28" ry="16"/>
                                    <g class="broto-eyes">
                                        <ellipse class="broto-eye broto-eye--l" cx="80" cy="136" rx="9" ry="11"/>
                                        <ellipse class="broto-eye broto-eye--r" cx="120" cy="136" rx="9" ry="11"/>
                                        <circle class="broto-shine broto-shine--l" cx="77" cy="132" r="3"/>
                                        <circle class="broto-shine broto-shine--r" cx="117" cy="132" r="3"/>
                                    </g>
                                    <path class="broto-mouth" d="M88 160c8 10 16 10 24 0"/>
                                    <ellipse class="broto-blush broto-blush--l" cx="68" cy="150" rx="8" ry="5"/>
                                    <ellipse class="broto-blush broto-blush--r" cx="132" cy="150" rx="8" ry="5"/>
                                </g>
                                <g class="broto-pot">
                                    <path d="M62 188h76l-8 28H70z"/>
                                    <rect x="56" y="180" width="88" height="12" rx="4"/>
                                </g>
                            </svg>
                        </span>
                    </button>
                    <div id="broto-playfield" class="broto-playfield" hidden></div>
                </div>

                <ul class="broto-stats" id="broto-stats">
                    <li data-stat="water"><span data-i18n="pages.games.brotoWater">Água</span><span class="broto-bar"><i></i></span></li>
                    <li data-stat="sun"><span data-i18n="pages.games.brotoSun">Sol</span><span class="broto-bar"><i></i></span></li>
                    <li data-stat="mood"><span data-i18n="pages.games.brotoMood">Humor</span><span class="broto-bar"><i></i></span></li>
                    <li data-stat="clean"><span data-i18n="pages.games.brotoClean">Vaso</span><span class="broto-bar"><i></i></span></li>
                </ul>

                <div class="broto-actions" id="broto-actions">
                    <button type="button" class="botao" data-action="water" data-i18n="pages.games.brotoActWater">Regar</button>
                    <button type="button" class="botao" data-action="sun" data-i18n="pages.games.brotoActSun">Sol</button>
                    <button type="button" class="botao" data-action="play" data-i18n="pages.games.brotoActPlay">Brincar</button>
                    <button type="button" class="botao" data-action="clean" data-i18n="pages.games.brotoActClean">Limpar</button>
                    <button type="button" class="botao botao-outline" data-action="sleep" id="broto-sleep">Dormir</button>
                </div>
                <p id="broto-hint" class="broto-hint"></p>
            </div>
        </section>
    </main>
